
name: Build Fishing Catch Timer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: fishing-catch-timer-1.2.0
          path: "**/build/libs/*.jar"
