
name: Build Fishing Catch Timer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        run: |
          chmod +x gradlew
          - name: Setup nektos/act
  # You may pin to the exact commit or the version.
  # uses: shubhbapna/setup-act@ae8973d4a55db1d5c53ebef943ae520c45907471
  uses: shubhbapna/setup-act@v1.0.0
  with:
    # default runner size for act
    default-runner-size: # optional, default is medium
          ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: fishing-catch-timer-1.2.0
          path: "**/build/libs/*.jar"
